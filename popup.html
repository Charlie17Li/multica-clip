<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multica Knowledge Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Capture to Multica</h1>
        <button id="settings-button" type="button">Settings</button>
      </header>

      <section aria-labelledby="source-heading">
        <h2 id="source-heading">Current page</h2>
        <dl>
          <dt>Title</dt><dd id="page-title">Loading…</dd>
          <dt>URL</dt><dd id="page-url">Loading…</dd>
          <dt>Site</dt><dd id="page-site">Loading…</dd>
        </dl>
      </section>

      <label for="note">Note <span>(optional)</span></label>
      <textarea id="note" rows="4" placeholder="Why is this worth keeping?"></textarea>
      <fieldset>
        <legend>Optional content</legend>
        <label class="choice" for="include-selection">
          <input id="include-selection" type="checkbox">
          Include the text I selected on this page
        </label>
        <label class="choice" for="include-snapshot">
          <input id="include-snapshot" type="checkbox">
          I confirm that I want to extract and upload a page-text snapshot
        </label>
        <p class="hint">A snapshot is read only after this confirmation. If it cannot be extracted, we create a link-mode issue instead.</p>
      </fieldset>
      <p class="privacy">By default, only this page's URL, title, site, capture time, and your note are submitted.</p>
      <button id="capture-button" type="button">Create capture issue</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="result" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
