<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multica Knowledge Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-title-key="popupTitle">
    <main>
      <header>
        <h1 data-i18n="captureToMultica">Capture to Multica</h1>
        <button id="settings-button" type="button" data-i18n="settings">Settings</button>
      </header>

      <section aria-labelledby="source-heading">
        <h2 id="source-heading" data-i18n="currentPage">Current page</h2>
        <dl>
          <dt data-i18n="title">Title</dt><dd id="page-title" data-i18n="loading">Loading…</dd>
          <dt data-i18n="url">URL</dt><dd id="page-url" data-i18n="loading">Loading…</dd>
          <dt data-i18n="site">Site</dt><dd id="page-site" data-i18n="loading">Loading…</dd>
        </dl>
      </section>

      <label for="note"><span data-i18n="note">Note</span> <span data-i18n="optional">(optional)</span></label>
      <textarea id="note" rows="4" placeholder="Why is this worth keeping?" data-i18n-placeholder="notePlaceholder"></textarea>
      <fieldset>
        <legend data-i18n="optionalContent">Optional content</legend>
        <label class="choice" for="include-snapshot">
          <input id="include-snapshot" type="checkbox">
          <span data-i18n="includeSnapshot">I confirm that I want to extract and upload a page-text snapshot</span>
        </label>
        <p class="hint" data-i18n="snapshotHint">A snapshot is read only after this confirmation. If it cannot be extracted, we create a link-mode issue instead.</p>
      </fieldset>
      <p class="privacy" data-i18n="privacy">By default, only this page's URL, title, site, capture time, and your note are submitted.</p>
      <button id="capture-button" type="button" data-i18n="createIssue">Create capture issue</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="result" aria-live="polite"></p>
    </main>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
