<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multica Knowledge Capture settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Multica Knowledge Capture settings</h1>
      <p class="intro">Configure where new knowledge-capture issues are created and which agent receives them.</p>
      <form id="settings-form">
        <label for="server-url">Multica server URL</label>
        <input id="server-url" type="url" placeholder="https://multica.example.com" autocomplete="url" required>

        <label for="access-token">Access token</label>
        <input id="access-token" type="password" placeholder="Paste a personal access token" autocomplete="off" required>
        <p class="hint">Stored only in this browser's extension storage and sent only to the configured Multica server.</p>

        <label for="project-id">Project ID</label>
        <input id="project-id" type="text" placeholder="Project UUID" autocomplete="off" required>

        <label for="agent-id">Agent ID</label>
        <input id="agent-id" type="text" placeholder="Agent UUID" autocomplete="off" required>
        <p class="hint">Every capture is created in this project and assigned to this agent.</p>

        <button type="submit">Save settings</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
